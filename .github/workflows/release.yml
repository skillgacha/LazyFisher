name: Release Build

on:
  push:
    tags:
      - 'v*' # "v1.0.0" などのタグがプッシュされたときにトリガー

permissions:
  contents: write


jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish EXE
      run: dotnet publish LazyFisher.csproj -c Release -r win-x64 /p:PublishSingleFile=true /p:SelfContained=true /p:EnableCompressionInSingleFile=true /p:PublishReadyToRun=false -o ./publish

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ./publish/LazyFisher.exe
        draft: false
        prerelease: false
        generate_release_notes: true
